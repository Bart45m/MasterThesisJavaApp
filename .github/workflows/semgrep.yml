# Name of this GitHub Actions workflow.
name: Semgrep CE scan

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "test-semgrep" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  semgrep:
    # User definable name of this GitHub Actions job.
    name: semgrep-oss/scan
    # If you are self-hosting, change the following `runs-on` value: 
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout. Use either v3 or v4.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Run the "semgrep scan" command on the command line of the docker image.
      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config "p/default" --config "p/java" --config "p/findsecbugs" \
            --sarif \
            --output semgrep-results.sarif \
            --metrics=off

      - name: Convert Textual Severities to Numbers
        if: always()
        shell: python
        run: |
          import json
          import os

          file_path = "semgrep-results.sarif"
          if os.path.exists(file_path):
              with open(file_path, "r") as f:
                  data = json.load(f)
              
              # Mapowanie wartości tekstowych na liczbowe wymagane przez GitHub
              mapping = {
                  "Critical": "9.5",
                  "High": "8.0",
                  "Medium": "5.5",
                  "Low": "2.0"
              }
              
              # Przeszukiwanie struktury JSON w poszukiwaniu pola security-severity
              for run in data.get("runs", []):
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      properties = rule.get("properties", {})
                      if "security-severity" in properties:
                          old_val = properties["security-severity"]
                          if old_val in mapping:
                              properties["security-severity"] = mapping[old_val]
              
              with open(file_path, "w") as f:
                  json.dump(data, f, indent=2)
              print("Pomyślnie zrzutowano wartości poziomu bezpieczeństwa na format numeryczny!")

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4
        # Wykonaj ten krok nawet wtedy, gdy Semgrep znajdzie luki bezpieczeństwa (błędy)
        if: always() 
        with:
          sarif_file: semgrep-results.sarif