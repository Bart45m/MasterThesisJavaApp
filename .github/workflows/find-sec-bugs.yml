name: Security Scan (FindSecBugs SARIF)

on:
  push:
    branches: [ "test-find-sec-bugs" ]

permissions:
  security-events: write
  contents: read

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Wymagane do zapisu wyników w zakładce Security -> Code scanning
      actions: read
      contents: read

    steps:
    # 1. Pobranie kodu źródłowego (Aktualizacja do v4)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Konfiguracja środowiska Java 25 (zgodnie z projektem master-thesis-java-app)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Kompilacja i skanowanie (Menedżer Maven sam pobierze wersje SpotBugs 4.10.4.1 i FindSecBugs 1.14.0 z pom.xml)
    - name: Run FindSecBugs with Maven
      run: mvn clean compile spotbugs:check

    # 4. Przesłanie pliku SARIF do modułu GitHub Code Scanning
    # Aktualizacja do v4 (najnowsza stabilna wersja akcji wspierana przez GitHub)
    - name: Upload SARIF file to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: target/spotbugsSarif.json
